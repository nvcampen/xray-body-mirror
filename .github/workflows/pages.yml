# Builds the anatomy model and the app, then publishes the site to the gh-pages branch
# (GitHub Pages serves it at https://<user>.github.io/xray-body-mirror/).
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy
      - run: npm install
      - uses: actions/cache@v4
        with:
          path: .cache
          key: human-atlas-1c38bf35
      - run: npm run anatomy
      - run: npm run build
      - name: Collect the site
        run: |
          mkdir -p _site
          cp -r index.html src assets dist ATTRIBUTION.md _site/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
